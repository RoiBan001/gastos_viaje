name: gastos_viaje
description: "Registra los gastos de un viaje y los convierte a pesos colombianos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # Textos de Flutter en español (calendario, botones de diálogos)
  flutter_localizations:
    sdk: flutter
  # Base de datos SQLite en el dispositivo
  sqflite: ^2.4.2
  # Arma la ruta del archivo de la base de datos
  path: ^1.9.0
  # Peticiones HTTP a la API de tasas de cambio
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
